name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests notebooks

      - name: Tests
        # The Neo4j tool tests skip themselves when no database is reachable.
        run: pytest -q

      - name: Check every reported number comes from a saved results file
        run: python -m src.check_results
